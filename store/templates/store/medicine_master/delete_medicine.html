<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Medicine</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 0;
        }

        .delete-container {
            width: 450px;
            margin: 100px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h2 {
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 16px;
        }

        .medicine-name {
            font-weight: bold;
        }

        .buttons {
            margin-top: 25px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            margin: 0 5px;
            cursor: pointer;
            border: none;
            font-size: 14px;
        }

        .cancel-btn {
            background: #ddd;
            color: #333;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }
    </style>
</head>

<body>

    <div class="delete-container">

        <h2>Delete Medicine</h2>

        <p>
            Are you sure you want to delete
            <span class="medicine-name">{{ medicine.name }}</span>?
        </p>

        <div class="buttons">

            <a href="{% url 'medicine_list' %}" class="btn cancel-btn">
                Cancel
            </a>

            <form method="POST" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="btn delete-btn">
                    Delete
                </button>
            </form>

        </div>

    </div>

</body>
</html>
